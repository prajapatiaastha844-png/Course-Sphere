<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reset password</title>
</head>
<body>
    <h1>Reset password</h1>
    <p>Enter the six-digit code sent to your email and choose a new password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Reset password</button>
    </form>
    <p><a href="{% url 'accounts:forgot_password' %}">Request a new code</a></p>
    <p><a href="{% url 'accounts:login' %}">Back to login</a></p>
</body>
</html>
