<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Log in</title>
</head>
<body>
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
    <p><a href="{% url 'accounts:forgot_password' %}">Forgot your password?</a></p>
    <p><a href="{% url 'accounts:register' role='student' %}">Register as a student</a></p>
    <p><a href="{% url 'accounts:register' role='instructor' %}">Register as an instructor</a></p>
</body>
</html>
