<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Register {{ role }}</title>
</head>
<body>
    <h1>Register {{ role }}</h1>
    {% if role == "Admin" %}
        <p>Admin profiles can only be created for staff accounts.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p><a href="{% url 'accounts:login' %}">Log in</a></p>
    <p><a href="{% url 'accounts:forgot_password' %}">Forgot your password?</a></p>
</body>
</html>
