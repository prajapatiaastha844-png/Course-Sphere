<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Account</title>
</head>
<body>
    <h1>Welcome, {{ profile.name|default:request.user.get_username }}</h1>
    {% if role %}
        <p>Role: {{ role }}</p>
    {% endif %}
    {% if request.user.is_staff and role != "Admin" %}
        <p><a href="{% url 'accounts:register' role='admin' %}">Create admin profile</a></p>
    {% endif %}
    <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>
</body>
</html>
