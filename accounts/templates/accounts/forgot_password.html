<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Forgot password</title>
</head>
<body>
    <h1>Forgot password</h1>
    {% if message %}
        <p>{{ message }}</p>
        <p><a href="{% url 'accounts:reset_password' %}">Enter your reset code</a></p>
    {% else %}
        <p>Enter your account email to receive a password reset code.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset code</button>
    </form>
    <p><a href="{% url 'accounts:login' %}">Back to login</a></p>
</body>
</html>
